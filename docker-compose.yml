# Base Docker Compose file. Used as-is on the production server.
# For local development, combine it with docker-compose.development.yml
# (see the docker:* scripts in package.json).

services:
  mongodb:
    image: mongo:8.0.20
    restart: unless-stopped
    volumes:
      - ./.volumes/mongodb:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017 --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    image: ghcr.io/mariamair/myphysiotrainer:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    depends_on:
      mongodb:
        condition: service_healthy

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run tests"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      run_lint:
        description: "Lint code"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: |
          docker build -f Dockerfile.production -t ghcr.io/${{ github.repository_owner }}/myphysiotrainer:latest .

      - name: Push Docker image to GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/myphysiotrainer:latest

  automated-api-tests:
    name: Automated API Tests
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.run_tests != 'false' }}
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh
      - name: Run Postman Tests
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          postman login --with-api-key $POSTMAN_API_KEY
          postman collection run "39898331-7adb9b48-3dce-4396-a240-b8c794652c46" -e "39898331-cd804792-4ca7-4ac4-b041-c646cf9ee3ab"

  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.run_lint != 'false' }}
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: npm install
      - run: npx eslint ./src

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.run_lint != 'false' }}
    needs: build 
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: npm install
      - run: npx eslint ./public

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, automated-api-tests, lint-backend, lint-frontend]
    if: |
      always() &&
      (needs.build.result == 'success') &&
      (needs.automated-api-tests.result == 'success' || needs.automated-api-tests.result == 'skipped') &&
      (needs.lint-backend.result == 'success' || needs.lint-backend.result == 'skipped') &&
      (needs.lint-frontend.result == 'success' || needs.lint-frontend.result == 'skipped')
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
      PRODUCTION_HOST_USER: ${{ secrets.PRODUCTION_HOST_USER }}
      PRODUCTION_HOST_DEPLOY_PATH: ${{ secrets.PRODUCTION_HOST_DEPLOY_PATH }}
      REGISTRY: ghcr.io/${{ github.repository }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          sudo apt-get update -y
          sudo apt-get install -y openssh-client   
          eval "$(ssh-agent -s)"
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H $PRODUCTION_HOST >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
    
      - name: Ensure deploy path exists
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 \
            $PRODUCTION_HOST_USER@$PRODUCTION_HOST \
            "mkdir -p $PRODUCTION_HOST_DEPLOY_PATH"

      - name: Create .env on server
        run: |
          ssh -i ~/.ssh/id_ed25519 $PRODUCTION_HOST_USER@$PRODUCTION_HOST << EOF
            cd $PRODUCTION_HOST_DEPLOY_PATH

          cat > .env.production << ENVEOF
          IMAGE_TAG=$IMAGE_TAG
          REGISTRY=$REGISTRY
          PRODUCTION_HOST=$PRODUCTION_HOST
          PRODUCTION_HOST_USER=$PRODUCTION_HOST_USER
          PRODUCTION_HOST_DEPLOY_PATH=$PRODUCTION_HOST_DEPLOY_PATH
          DB_CONNECTION_STRING=${{ secrets.DB_CONNECTION_STRING }}
          NODE_ENV=production
          PORT=8080
          BASE_URL=/
          API_URL=http://localhost:8080/api/v1
          SESSION_NAME=${{ secrets.SESSION_NAME }}
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          LOG_LEVEL=info
          LOGGER_COMBINED_LOG_FILE=${{ secrets.LOGGER_COMBINED_LOG_FILE }}
          LOGGER_ERROR_LOG_FILE=${{ secrets.LOGGER_ERROR_LOG_FILE }}
          LOGGER_UNCAUGHT_EXCEPTION_LOG_FILE=${{ secrets.LOGGER_UNCAUGHT_EXCEPTION_LOG_FILE }}
          ENVEOF
          EOF
      
      - name: Copy docker-compose files to server
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 \
            docker-compose.yml \
            docker-compose.production.yml \
            $PRODUCTION_HOST_USER@$PRODUCTION_HOST:$PRODUCTION_HOST_DEPLOY_PATH/

      - name: Pull and Deploy Docker Image via SSH
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 \
            $PRODUCTION_HOST_USER@$PRODUCTION_HOST << EOF
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull ghcr.io/${{ github.repository_owner }}/myphysiotrainer:latest
            docker logout ghcr.io
            cd $PRODUCTION_HOST_DEPLOY_PATH
            docker compose -p myphysiotrainer \
            -f docker-compose.yml \
            --env-file .env.production \
            up -d
            exit
          EOF

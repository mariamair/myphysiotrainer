# Docker Compose overrides for local development.
# Extends docker-compose.yml:
# - Builds the app image locally from the same Dockerfile as production.
# - Mounts the source code and restarts the app on changes (node --watch).
# - Stores MongoDB data in a named Docker volume instead of a host folder
#   (bind-mounted MongoDB data fails on Docker Desktop for Mac).
# - Containers don't start automatically when Docker Desktop starts.

services:
  mongodb:
    restart: "no"
    # Hide MongoDB's logs in 'docker compose up' output.
    attach: false
    volumes:
      - mongodb-data:/data/db

  app:
    image: myphysiotrainer:dev
    build:
      context: .
    restart: "no"
    command: ["node", "--watch", "--inspect=0.0.0.0:9229", "src/server.js"]
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    ports:
      # Node.js debugger, only reachable from your own machine.
      - "127.0.0.1:9229:9229"

volumes:
  mongodb-data:
